name: xyz-mailroomapp-infra-deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  TF_VAR_backend_iam_user_arn: ${{ secrets.BACKEND_IAM_USER_ARN }}

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        run: |
          terraform init \
            --backend-config="key=${{ secrets.TF_STATE_KEY }}"

      - name: Terraform Plan
        run: terraform plan --var-file="vars/prod.tfvars"

      - name: Terraform Apply
        run: terraform apply --auto-approve --var-file="vars/prod.tfvars"

      - name: Print backend outputs
        run: |
          echo "=== Backend outputs ==="
          echo "Role ARN:    $(terraform output -raw backend_role_arn)"
          echo "KMS Key ID:  $(terraform output -raw backend_kms_key_id)"
          echo "Tables:      $(terraform output -json backend_table_names)"

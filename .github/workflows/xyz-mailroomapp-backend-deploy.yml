name: xyz-mailroomapp-backend-deploy

on:
  push:
    branches: [main]
    paths:
      - "nodejs/backend/**"
      - "tsconfig.base.json"
  workflow_dispatch:

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/xyz-mailroomapp-backend

jobs:
  build-and-push:
    name: Build & push to ghcr.io
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Docker setup ────────────────────────────────────────────────────────

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Image metadata ──────────────────────────────────────────────────────
      # Tags:
      #   ghcr.io/<owner>/xyz-mailroomapp-backend:latest   (main branch)
      #   ghcr.io/<owner>/xyz-mailroomapp-backend:<sha>    (every push)

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      # ── Build & push ─────────────────────────────────────────────────────────
      # Context = repo root so tsconfig.base.json is reachable from the Dockerfile

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    nodejs/backend/Dockerfile
          push:    true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Print image digest
        run: echo "Pushed ${{ steps.meta.outputs.tags }} @ ${{ steps.build.outputs.digest }}"

  # ── Deploy to Railway ────────────────────────────────────────────────────────
  # Railway watches ghcr.io for new pushes automatically IF you connect the
  # registry in Railway settings (Project → Service → Source → Image).
  # Alternatively, trigger a redeploy via Railway's deploy webhook:

  deploy:
    name: Trigger Railway redeploy
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Redeploy on Railway
        run: |
          curl --silent --fail --show-error \
            -X POST "${{ secrets.RAILWAY_BACKEND_DEPLOY_WEBHOOK }}"
        # Secret: RAILWAY_BACKEND_DEPLOY_WEBHOOK
        # Get it from: Railway → Project → Service → Settings → Deploy Webhook

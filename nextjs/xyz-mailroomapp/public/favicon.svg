<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

  <!--
    Animated favicon: Lucide Mail + Lucide Rocket
    Rocket enters from lower-left, passes through the envelope, exits upper-right.
    Duration: 2.8s loop.
  -->

  <!-- ─── Mail (static, centred in 32×32) ─────────────────────────────────── -->
  <!-- Lucide Mail paths shifted +4,+4 to centre the 24×24 icon in 32×32 -->
  <g transform="translate(4,4)">
    <rect width="20" height="16" x="2" y="4" rx="2"/>
    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
  </g>

  <!-- Envelope V-fold apex in 32×32 coords: (4+12, 4+7) = (16, 11) -->
  <!-- Envelope body spans x:6–26  y:8–24                           -->

  <!-- ─── Glow inside envelope while rocket is inside ─────────────────────── -->
  <!-- Positioned over the envelope interior, fades in/out -->
  <rect x="6" y="11" width="20" height="13" rx="1.5" stroke="none" fill="currentColor">
    <animate attributeName="opacity"
             values="0;0;0;0;0.12;0.18;0.12;0;0;0"
             keyTimes="0;0.1;0.3;0.38;0.45;0.52;0.60;0.65;0.85;1"
             dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- ─── Rocket (animated) ──────────────────────────────────────────────── -->
  <!--
    The rocket group is centered at (0,0) using Lucide's 24×24 paths
    scaled to 0.38× so the full rocket is ~9px — readable at favicon size.
    An animateTransform moves the group's origin through the mail opening.

    Key positions (group origin = approximate rocket centroid):
      t=0.00  (2, 35)   — below frame, invisible
      t=0.12  (2, 35)   — same (hold, opacity fades in)
      t=0.32  (10, 22)  — lower-left, approaching
      t=0.40  (15, 16)  — entering the envelope opening (opacity → 0)
      t=0.62  (17, 14)  — inside (invisible)
      t=0.68  (21, 10)  — exiting upper-right (opacity → 1)
      t=0.82  (29, 3)   — clear of envelope, flying away
      t=0.90  (33, -1)  — above frame, opacity → 0
      t=1.00  (2, 35)   — reset (invisible)
  -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="2,35; 2,35; 10,22; 15,16; 17,14; 17,14; 21,10; 29,3; 33,-1; 2,35"
      keyTimes="0;   0.12; 0.32; 0.40; 0.45; 0.62; 0.68; 0.82; 0.90; 1"
      dur="2.8s" repeatCount="indefinite" calcMode="linear"/>

    <animate attributeName="opacity"
      values="0;0;1;1;0;0;0;1;1;0;0"
      keyTimes="0;0.10;0.14;0.38;0.42;0.45;0.64;0.68;0.82;0.90;1"
      dur="2.8s" repeatCount="indefinite"/>

    <!-- Lucide Rocket @ 0.38× scale, origin at Lucide's natural centroid (~13,9) -->
    <!-- Pre-translate so (13,9) becomes (0,0), then scale -->
    <g transform="translate(-4.94,-3.42) scale(0.38)">
      <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09"/>
      <path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z"/>
      <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05"/>
      <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
    </g>
  </g>

</svg>
